<title>YOUV — YOU VICTORY</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#050505;color:#f5f2ea;font-family:Arial,sans-serif;line-height:1.5}
header{position:fixed;top:0;left:0;right:0;z-index:10;background:#050505ee;border-bottom:1px solid #d7b35d33}
nav{max-width:1100px;margin:auto;height:64px;padding:0 18px;display:flex;align-items:center;justify-content:space-between}
.logo{font-size:22px;letter-spacing:6px;color:#e7c66f}
nav a{color:#aaa;text-decoration:none;margin:0 9px;font-size:10px;letter-spacing:1px}
.langs button{background:none;border:1px solid #444;color:#aaa;padding:6px 8px;margin-left:3px;cursor:pointer}
.langs button.active{border-color:#d7b35d;color:#e7c66f}
section{padding:105px 20px}.wrap{max-width:1050px;margin:auto}
.hero{min-height:100vh;display:flex;align-items:center;text-align:center;background:radial-gradient(circle,#d7b35d14,transparent 45%)}
.key{font-size:72px;color:#d7b35d;display:inline-block;transform:rotate(-45deg);margin-bottom:8px}
.brand{font-size:11px;letter-spacing:5px;color:#d7b35d}.hero h1{font-size:clamp(60px,12vw,125px);font-weight:300;letter-spacing:15px;margin:0;color:#e7c66f}
.hero h2{letter-spacing:6px;font-size:13px;font-weight:400}.line{width:70px;height:1px;background:#d7b35d;margin:30px auto}
.hero h3{font-size:clamp(38px,6vw,68px);line-height:1.02;margin:0 0 20px}.gold{color:#e7c66f}
.lead{max-width:760px;margin:auto;color:#aaa;font-size:18px}.btn{display:inline-block;margin-top:30px;padding:17px 32px;background:#d7b35d;color:#050505;text-decoration:none;font-weight:bold;font-size:12px;letter-spacing:2px}
.dark{background:#0b0b0b}.center{text-align:center}.big{font-size:clamp(35px,6vw,60px);font-weight:bold;line-height:1.05}
.small{max-width:720px;margin:25px auto;color:#999;text-align:center}.cards{display:grid;grid-template-columns:1fr 1fr;gap:1px;margin-top:45px}
.card,.level,.tool{padding:28px;background:#111;border:1px solid #292929}.card h3,.tool h3{color:#e7c66f;font-weight:400}.card li{color:#aaa;margin:9px 0}
.levels{display:grid;grid-template-columns:repeat(5,1fr);gap:1px}.level b{color:#d7b35d}.level p,.tool p{color:#999;font-size:13px}
.title{text-align:center;font-size:44px;font-weight:300}.tools{display:grid;grid-template-columns:1fr 1fr;gap:15px}
.tools-text{text-align:center;margin-left:auto;margin-right:auto;}
.quote{text-align:center;font-size:clamp(32px,5vw,55px);font-weight:bold;line-height:1.08}
.form{max-width:500px;margin:35px auto;padding:30px;background:#101010;border:1px solid #44371f}.form input{width:100%;padding:15px;margin:6px 0;background:#050505;border:1px solid #333;color:#fff}
.form button{width:100%;padding:16px;margin-top:7px;background:#d7b35d;border:0;font-weight:bold}.note{color:#666;font-size:11px;margin-top:15px}
footer{text-align:center;padding:40px;color:#666;border-top:1px solid #222}footer b{color:#d7b35d}
@media(max-width:800px){nav a{display:none}.cards,.tools{grid-template-columns:1fr}.levels{grid-template-columns:1fr 1fr}}
@media(max-width:500px){.levels{grid-template-columns:1fr}.hero h1{letter-spacing:8px}}
</style>
</head>

</nav>

<div class="tools">

<div class="tool"><h3 data-t="t4"></h3><p data-t="p4"></p></div>

<section><div class="wrap"><div class="quote" data-t="quote"></div></div></section>

<section id="start" class="dark"><div class="wrap center">
<h2 class="title" data-t="cta"></h2>
<p class="small" data-t="ctaText"></p>
<div class="form">

<p data-t="formText"></p>
<form action="https://formsubmit.co/zorin.robert2017@gmail.com" method="POST">
<input name="name" id="name" required>

<input type="hidden" name="_captcha" value="false">
<input type="text" name="_honey" style="display:none">  
<button type="submit" data-t="submit"></button>
</form>
<div class="note" data-t="note"></div>
</div></div></section>

<footer><b>YOUV</b> — <span data-t="brand"></span><br><br><span data-t="success"></span></footer>
